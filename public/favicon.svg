<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The home page's ringed planet, as a pen outline on paper. -->
  <style>
    .ink { fill: none; stroke: #1c1b19; stroke-width: 1.9; stroke-linecap: round; }
    .paper { fill: #f3f1ec; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e8e5dd; }
      .paper { fill: #141413; }
    }
  </style>
  <g transform="rotate(-22 16 16)">
    <ellipse class="ink" cx="16" cy="16" rx="14.2" ry="4.4" />
    <circle class="ink paper" cx="16" cy="16" r="8.4" />
    <path class="ink" d="M1.8 16A14.2 4.4 0 0 0 30.2 16" />
  </g>
</svg>
